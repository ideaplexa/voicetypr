[package]
name = "voicetypr"
version = "2.0.6-beta.11"
description = "open source voice to text transcription app"
authors = ["moinulmoin"]
edition = "2021"

[workspace]
members = [".", "crates/keytrigger", "crates/transcript-text", "crates/vulkan-device-select"]
resolver = "2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "voicetypr_lib"
crate-type = ["staticlib", "cdylib", "rlib"]
doctest = false

[features]
default = []

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
keytrigger = { path = "crates/keytrigger" }
transcript-text = { path = "crates/transcript-text" }
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
whisper-rs = { version = "0.16.0" }
cpal = "0.16.0"
hound = "3.5.1"
symphonia = { version = "0.5", features = ["all"] }
rubato = "2.0"
audioadapter-buffers = "3.0"
parking_lot = "0.12"
futures-util = "0.3.31"
tokio = { version = "1.46.0", features = ["full"] }
reqwest = { version = "0.13.4", features = ["json", "stream", "multipart", "blocking", "query"] }
enigo = "0.5.0"
rdev = "0.5.3"
sha2 = "0.10.9"
sha1 = "0.10.6"
arboard = { version = "3.6.0", features = ["image"] }
clipboard-rs = "0.2"
dirs = "5"
log = "0.4"
tauri-plugin-log = { version = "2", features = ["colored"] }
chrono = { version = "0.4", features = ["serde"] }
tauri-plugin-updater = "2.9.0"
tauri-plugin-process = "2.3.0"
once_cell = "1.20"
dotenv = "0.15"
thiserror = "1.0"
regex = "1.10"
lazy_static = "1.4"
keyboard-types = "0.7"
aes-gcm = "0.10"
rand = "0.8"
base64 = "0.22"
hex = "0.4"
image = "0.25"
pbkdf2 = "0.12"
sysinfo = "0.36.1"
tauri-plugin-notification = "2.3.3"
warp = "0.3"
bytes = "1"
tempfile = "3.10"
command-group = { version = "5.0.1", features = ["with-tokio"] }
libc = "0.2"
hostname = "0.4"
local-ip-address = "0.6"
uuid = { version = "1", features = ["v4"] }
active-win-pos-rs = "0.10.1"
clap = { version = "4.5", features = ["derive"] }
genai = "=0.6.0"
tokio-util = "0.7"
sentry = { version = "0.42", default-features = false, features = ["backtrace", "panic", "transport", "rustls", "debug-images"] }
which = "4.4.2"
posthog-rs = { version = "0.22.0", default-features = false }
[target.'cfg(target_os = "macos")'.dependencies]
whisper-rs = { version = "0.16.0", features = ["metal"] }
tauri = { version = "2", features = ["macos-private-api", "tray-icon"] }
tauri-nspanel = { git = "https://github.com/ahkohd/tauri-nspanel", branch = "v2" }
tauri-plugin-macos-permissions = "2"
core-graphics = "0.24"
coreaudio-sys = "0.2"
media-remote = "0.3"
objc2 = "0.6.4"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSBitmapImageRep", "NSButton", "NSControl", "NSGraphics", "NSGraphicsContext", "NSImage", "NSImageRep", "NSView", "NSWindow", "NSWorkspace"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSData", "NSDictionary", "NSString", "NSGeometry"] }

[target.'cfg(all(target_os = "windows", target_arch = "x86_64"))'.dependencies]
whisper-rs = { version = "0.16.0" }

[target.'cfg(all(target_os = "windows", target_arch = "aarch64"))'.dependencies]
whisper-rs = { version = "0.16.0" }

[target.'cfg(target_os = "windows")'.dependencies]
whisper-rs = { version = "0.16.0", features = ["openmp"] }
windows = { version = "0.62", features = [
    "ApplicationModel",
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_System_LibraryLoader",
    "Win32_System_Diagnostics_Debug",
    "Win32_Security_Cryptography",
    "Media_Control",
    "Foundation",
    "Win32_Graphics_Dxgi",
    "Win32_System_Console",
] }
winreg = "0.52"
[dev-dependencies]
tauri = { version = "2", features = ["test"] }
tempfile = "3.10"
tokio-test = "0.4"
mockall = "0.12"
serial_test = "3.0"
rand = "0.8"
wiremock = "0.6"
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-fs = "2"
tauri-plugin-mic-recorder = "2"
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
tauri-plugin-store = "2"
tauri-plugin-autostart = "2"
tauri-plugin-os = "2"
tauri-plugin-single-instance = "2"
[profile.dev]
# Keep development transcriptions responsive without paying full release-build
# compile times. Audio preparation is CPU-heavy and otherwise runs unoptimized.
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
# Client-side crash symbolication for GlitchTip (server-side symbolication via
# uploaded PDB/dSYM/debug files): line tables give function + file:line resolved
# in-process at capture (sentry `backtrace`); strip = "none" keeps the symbol
# table so macOS resolves names. Windows additionally emits voicetypr.pdb,
# shipped beside the exe (see windows/installer-hooks.nsh) so dbghelp can
# resolve at runtime. Debug-image metadata is scrubbed to basenames in
# `telemetry::scrub_debug_meta` before egress.
debug = "line-tables-only"
strip = "none"
