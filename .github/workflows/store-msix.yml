name: Store MSIX

on:
  workflow_dispatch:
    inputs:
      commit_sha:
        description: 'Exact 40-character commit SHA to package'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ inputs.commit_sha }}
  cancel-in-progress: true

jobs:
  preflight:
    name: Frontend preflight
    runs-on: ubuntu-latest
    outputs:
      commit_sha: ${{ steps.verify.outputs.commit_sha }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          ref: ${{ inputs.commit_sha }}

      - name: Verify immutable package revision
        id: verify
        env:
          REQUESTED_SHA: ${{ inputs.commit_sha }}
          GIT_TERMINAL_PROMPT: '0'
        run: |
          if [[ ! "$REQUESTED_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::commit_sha must be a full lowercase commit SHA"
            exit 1
          fi
          if [[ "$(git rev-parse HEAD)" != "$REQUESTED_SHA" ]]; then
            echo "::error::Checkout does not match requested commit"
            exit 1
          fi
          # Trust gate: only revisions already merged into main may be packaged.
          # Fetch the full history of main (no --depth) so the ancestry decision is
          # deterministic; a bounded depth could false-reject older reviewed commits.
          git fetch --no-tags origin '+refs/heads/main:refs/remotes/origin/main'
          if ! git merge-base --is-ancestor "$REQUESTED_SHA" refs/remotes/origin/main; then
            echo "::error::commit_sha $REQUESTED_SHA is not an ancestor of origin/main; only reviewed commits on main can be packaged"
            exit 1
          fi
          echo "commit_sha=$REQUESTED_SHA" >> "$GITHUB_OUTPUT"

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22.19.0'
          package-manager-cache: false

      - name: Setup pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.13.1 --activate
          pnpm --version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: TypeScript check
        run: pnpm typecheck

      - name: Run tests
        run: pnpm exec vitest run src

  build-store-msix:
    name: Build Store MSIX
    needs: preflight
    runs-on: windows-2022
    timeout-minutes: 90
    env:
      CARGO_TERM_COLOR: always
      CARGO_TARGET_DIR: 'D:\b\app'
      ORT_CACHE_DIR: 'D:\b\ort-cache'
      RUST_BACKTRACE: 1
      POSTHOG_PROJECT_TOKEN: ${{ vars.POSTHOG_PROJECT_TOKEN }}
      VULKAN_RUNTIME_VERSION: 1.3.290.0
      WHISPER_VULKAN_TARGET_DIR: 'D:\b\vulkan'
      WINAPPCLI_VERSION: v0.3.2
      WINAPPCLI_X64_SHA256: 231373a4605ce7749172a70534ebab9305f91116e7f68d25cc73051372a6c579
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false
          ref: ${{ needs.preflight.outputs.commit_sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Setup pnpm
        shell: pwsh
        run: |
          corepack enable
          corepack prepare pnpm@10.13.1 --activate
          pnpm --version

      - name: Get pnpm store path
        id: pnpm-store
        shell: pwsh
        run: |
          "path=$(pnpm store path --silent)" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Cache pnpm store
        uses: actions/cache@v5
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup WinApp CLI
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP "winappcli-x64.zip"
          $toolRoot = Join-Path $env:RUNNER_TOOL_CACHE "winappcli\$env:WINAPPCLI_VERSION\x64"
          $downloadUrl = "https://github.com/microsoft/WinAppCli/releases/download/$env:WINAPPCLI_VERSION/winappcli-x64.zip"

          Invoke-WebRequest -Uri $downloadUrl -OutFile $archive
          $actualHash = (Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actualHash -ne $env:WINAPPCLI_X64_SHA256) {
            throw "WinApp CLI SHA-256 mismatch: expected $env:WINAPPCLI_X64_SHA256, got $actualHash"
          }

          Remove-Item $toolRoot -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path $toolRoot | Out-Null
          Expand-Archive -Path $archive -DestinationPath $toolRoot -Force

          $winapp = Get-ChildItem -Path $toolRoot -Recurse -Filter winapp.exe | Select-Object -First 1
          if (-not $winapp) {
            throw "winapp.exe not found in WinApp CLI archive"
          }

          $winapp.Directory.FullName | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Prepare cargo target dir
        shell: pwsh
        run: New-Item -ItemType Directory -Force -Path $env:CARGO_TARGET_DIR | Out-Null

      - name: Rust cache
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32
        with:
          shared-key: windows-store-x64-build
          key: vulkan-${{ env.VULKAN_RUNTIME_VERSION }}
          workspaces: |
            src-tauri -> ../../../../b/app
            sidecar/whisper-vulkan -> ../../../../../b/vulkan

      - name: Cache ONNX Runtime archive
        uses: actions/cache@v5
        with:
          path: D:\b\ort-cache
          key: ort-windows-x64-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: ort-windows-x64-

      - name: Install Vulkan SDK
        uses: jakoch/install-vulkan-sdk-action@b394a1abed9cb019d8e637eeadac93d73e0853da
        with:
          vulkan_version: 1.3.290.0
          install_runtime: true
          cache: true

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify WinApp CLI
        shell: pwsh
        run: winapp --help

      - name: Build and pack Store MSIX
        shell: pwsh
        run: pnpm windows:store:msix

      - name: Assert CPU build does not import vulkan-1.dll
        shell: pwsh
        run: |
          & ./src-tauri/windows/assert-no-vulkan-import.ps1 -ExePath "$env:CARGO_TARGET_DIR\release\voicetypr.exe"

      - name: Assert ONNX Runtime is not a DLL import
        shell: pwsh
        run: |
          & ./src-tauri/windows/assert-no-onnxruntime-import.ps1 -ExePath "$env:CARGO_TARGET_DIR\release\voicetypr.exe"

      - name: Upload Store MSIX artifact
        uses: actions/upload-artifact@v6
        with:
          name: store-msix-windows-x64
          path: |
            target/store-msix/*.msix
            target/store-msix/stage/Package.appxmanifest
          retention-days: 7
