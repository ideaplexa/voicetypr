name: Native CI

# Reusable native lanes. Every job runs on a literal GitHub-hosted runner
# label; callers cannot inject a runner label, matrix, timeout, or checkout
# ref. The original caller `github` context (event, ref, sha) is retained,
# so checkout lands on the caller's revision.

on:
  workflow_call:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # ===========================================
  # Build macOS (Apple Silicon)
  # ===========================================
  build-macos:
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Select Swift 6 toolchain and configure Clang runtime
        run: |
          xcode=$(
            find /Applications -maxdepth 1 \( -type d -o -type l \) \
              \( -name 'Xcode_1[6-9]*.app' -o -name 'Xcode_[2-9][0-9]*.app' \) \
              | sort -V \
              | tail -1
          )
          if [ -z "$xcode" ]; then echo "No Xcode >=16 (Swift 6) found on runner" >&2; exit 1; fi
          echo "Selecting $xcode"
          sudo xcode-select -s "$xcode"
          swift --version
          # Xcode 16.4 emits availability checks in whisper.cpp's Metal objects,
          # but Rust's final link does not automatically include compiler-rt.
          # Older toolchains (e.g. GitHub-hosted Xcode 16.2) may not ship or
          # require the archive, so discovery is bundle-local and optional:
          # link libclang_rt.osx.a only when the selected Xcode actually has one.
          clang_runtime=$(
            find "$xcode/Contents/Developer/Toolchains/XcodeDefault.xctoolchain/usr/lib/clang" \
              -type f -name 'libclang_rt.osx.a' 2>/dev/null \
              | sort -V \
              | tail -1
          )
          if [ -n "$clang_runtime" ]; then
            echo "Linking compiler-rt archive: $clang_runtime"
            echo "RUSTFLAGS=${RUSTFLAGS:+$RUSTFLAGS }-C link-arg=$clang_runtime" >> "$GITHUB_ENV"
          else
            echo "No libclang_rt.osx.a in $xcode; continuing without explicit compiler-rt."
          fi

      - name: Capture Swift toolchain cache key
        id: swift-toolchain
        run: echo "hash=$(swift --version | shasum -a 256 | cut -d ' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Cache Swift Parakeet build
        uses: actions/cache@v5
        with:
          path: sidecar/parakeet-swift/.build
          key: parakeet-swift-${{ runner.os }}-${{ runner.arch }}-${{ steps.swift-toolchain.outputs.hash }}-${{ hashFiles('sidecar/parakeet-swift/Package.swift', 'sidecar/parakeet-swift/Package.resolved', 'sidecar/parakeet-swift/build.sh', 'sidecar/parakeet-swift/Sources/**') }}
          restore-keys: |
            parakeet-swift-${{ runner.os }}-${{ runner.arch }}-${{ steps.swift-toolchain.outputs.hash }}-

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22.19.0'
          package-manager-cache: false

      - name: Setup pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.13.1 --activate
          pnpm --version

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@67b7c9de7d66c881487796e401478f3cb00704b0  # 1.91.1
        with:
          components: clippy

      - name: Rust cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6  # v2.9.2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build frontend
        run: pnpm build

      - name: Rust tests
        run: cd src-tauri && cargo test

      - name: Clippy
        run: cd src-tauri && cargo clippy --workspace --all-targets -- -D warnings

      - name: Build Tauri (release)
        run: cd src-tauri && cargo build --release

      - name: Upload preview artifact
        uses: actions/upload-artifact@v6
        with:
          name: ci-macos-aarch64-preview
          path: src-tauri/target/release/voicetypr
          retention-days: 30

  # Build Windows (CPU-safe app + Vulkan sidecar)
  # ===========================================
  build-windows:
    runs-on: windows-2022
    timeout-minutes: 120
    env:
      # Keep Windows paths short to avoid MSBuild/FileTracker failures on deep dependency trees.
      CARGO_TARGET_DIR: D:\b\app
      VULKAN_RUNTIME_VERSION: 1.3.296.0
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Set GGML CPU baseline
        uses: ./.github/actions/ggml-cpu-baseline

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22.19.0'
          package-manager-cache: false

      - name: Setup pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.13.1 --activate
          pnpm --version

      - name: Prepare cargo target dir
        shell: pwsh
        run: New-Item -ItemType Directory -Force -Path $env:CARGO_TARGET_DIR | Out-Null

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@67b7c9de7d66c881487796e401478f3cb00704b0  # 1.91.1
        with:
          components: clippy

      - name: Rust cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6  # v2.9.2
        with:
          # whisper-rs-sys does not track GGML_* as Cargo rerun triggers.
          env-vars: GGML
          shared-key: windows-x64-build-vk${{ env.VULKAN_RUNTIME_VERSION }}
          workspaces: |
            src-tauri -> ../../../../b/app
            sidecar/whisper-vulkan -> ../../../../../b/vulkan

      - name: Install Vulkan SDK
        uses: jakoch/install-vulkan-sdk-action@d17de7e2f5e50efb5d2123efed18497d3c58c533  # v1.7.0
        with:
          vulkan_version: 1.3.296.0
          install_runtime: true
          cache: true

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Whisper Vulkan sidecar
        shell: pwsh
        env:
          CARGO_TARGET_DIR: D:\b\vulkan
          RUSTFLAGS: -C target-feature=+crt-static
        run: |
          cargo build --manifest-path sidecar/whisper-vulkan/Cargo.toml --release
          if ($LASTEXITCODE -ne 0) {
            throw "Whisper Vulkan sidecar build failed with exit code $LASTEXITCODE"
          }
          New-Item -ItemType Directory -Force -Path "sidecar/whisper-vulkan/dist" | Out-Null
          $targetDir = $env:CARGO_TARGET_DIR
          if ([string]::IsNullOrWhiteSpace($targetDir)) {
            $targetDir = "sidecar/whisper-vulkan/target"
          }
          $sidecarExe = Join-Path $targetDir "release/whisper-vulkan-sidecar.exe"
          if (-not (Test-Path $sidecarExe)) {
            throw "Whisper Vulkan sidecar binary not found: $sidecarExe"
          }
          Copy-Item $sidecarExe "sidecar/whisper-vulkan/dist/whisper-vulkan-sidecar-x86_64-pc-windows-msvc.exe"

      - name: Stage Visual C++ runtime DLLs
        shell: pwsh
        run: pwsh scripts/stage-windows-vc-runtime.ps1 -OutDir src-tauri/windows/resources/vcredist

      - name: Build frontend
        run: pnpm build

      - name: Clippy
        run: cd src-tauri && cargo clippy --workspace --all-targets -- -D warnings

      - name: Build and run Rust tests on Windows
        shell: pwsh
        working-directory: src-tauri
        run: ./run-tests.ps1

      # Build the real NSIS installer with the same flags as release.yml (static CRT,
      # relative PDB path) so the install check below tests what ships.
      - name: Build Tauri installer (release, CPU-safe main app)
        env:
          VOICETYPR_REQUIRE_VULKAN_SIDECAR: "1"
        shell: pwsh
        run: |
          # Only this main-executable build writes the map, never clippy/tests.
          $targetRoot = [IO.Path]::GetFullPath($env:CARGO_TARGET_DIR).Replace('\', '/')
          $env:RUSTFLAGS = "$env:RUSTFLAGS -C target-feature=+crt-static -C link-arg=/PDBALTPATH:%_PDB% -C link-arg=/MAP:$targetRoot/voicetypr.map".Trim()
          pnpm tauri build --bundles nsis --ci --config src-tauri/tauri.windows.conf.json
          if ($LASTEXITCODE -ne 0) { throw "Tauri build failed: $LASTEXITCODE" }

      - name: Assert CPU build does not import vulkan-1.dll
        shell: pwsh
        run: |
          & ./src-tauri/windows/assert-no-vulkan-import.ps1 -ExePath "$env:CARGO_TARGET_DIR/release/voicetypr.exe"

      - name: Check Windows installer (install, dependencies, launch, uninstall)
        shell: pwsh
        run: |
          $installer = Get-ChildItem "$env:CARGO_TARGET_DIR\release\bundle\nsis\*.exe" | Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if (-not $installer) {
            throw "No NSIS installer found at $env:CARGO_TARGET_DIR\release\bundle\nsis\*.exe"
          }
          & ./scripts/check-windows-install.ps1 -Installer $installer.FullName

      - name: Assert ONNX Runtime is lazy-loaded, not imported or statically linked
        shell: pwsh
        run: |
          & ./src-tauri/windows/assert-no-onnxruntime-import.ps1 -ExePath "$env:CARGO_TARGET_DIR/release/voicetypr.exe" -MapPath "$env:CARGO_TARGET_DIR/voicetypr.map"

      - name: Upload preview artifact
        uses: actions/upload-artifact@v6
        with:
          name: ci-windows-x64-preview
          path: D:/b/app/release/voicetypr.exe
          retention-days: 30

      - name: Upload Windows installer for hardware evaluation
        uses: actions/upload-artifact@v6
        with:
          name: ci-windows-x64-nsis
          path: D:/b/app/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 30
