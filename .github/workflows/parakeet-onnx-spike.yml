name: Parakeet ONNX spike (Windows)

on:
  # Research benchmark only. This does not evaluate the integrated app.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bench:
    runs-on: windows-2022
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    env:
      MODEL_DIR: ${{ github.workspace }}/.tmp/models/parakeet-tdt-0.6b-v3-onnx
      CLIPS_DIR: ${{ github.workspace }}/.tmp/eval
    steps:
      - uses: actions/checkout@v4
      - name: Rust toolchain (from rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            tools/parakeet-onnx-spike/target
          key: spike-${{ runner.os }}-${{ hashFiles('tools/parakeet-onnx-spike/Cargo.lock') }}
      - uses: actions/cache@v4
        with:
          path: .tmp/models
          key: spike-models-${{ runner.os }}-${{ hashFiles('.github/workflows/parakeet-onnx-spike.yml') }}
      - name: Download model (int8)
        run: |
          mkdir -p "$MODEL_DIR"
          for f in vocab.txt decoder_joint-model.int8.onnx encoder-model.int8.onnx; do
            [ -s "$MODEL_DIR/$f" ] || curl -sSfL -o "$MODEL_DIR/$f" "https://huggingface.co/istupakov/parakeet-tdt-0.6b-v3-onnx/resolve/8f23f0c03c8761650bdb5b40aaf3e40d2c15f1ce/$f"
          done
          cd "$MODEL_DIR"
          sha256sum --check <<'HASHES'
          6139d2fa7e1b086097b277c7149725edbab89cc7c7ae64b23c741be4055aff09  encoder-model.int8.onnx
          eea7483ee3d1a30375daedc8ed83e3960c91b098812127a0d99d1c8977667a70  decoder_joint-model.int8.onnx
          d58544679ea4bc6ac563d1f545eb7d474bd6cfa467f0a6e2c1dc1c7d37e3c35d  vocab.txt
          HASHES
          ls -l "$MODEL_DIR"
      - name: Install ffmpeg
        run: choco install ffmpeg -y --no-progress
      - name: Fetch eval clips (MLS test, CC BY 4.0)
        run: python tools/parakeet-onnx-spike/fetch_eval.py "$CLIPS_DIR"
      - name: Build spike (release)
        working-directory: tools/parakeet-onnx-spike
        run: cargo build --release --locked
      - name: Binary size
        run: ls -l tools/parakeet-onnx-spike/target/release/parakeet-onnx-spike.exe
      - name: Bench (4 threads)
        working-directory: tools/parakeet-onnx-spike
        run: ./target/release/parakeet-onnx-spike.exe --model "$MODEL_DIR" --bench "$CLIPS_DIR" --threads 4 | tee "$GITHUB_WORKSPACE/bench-windows.txt"
      - name: Summary
        if: always()
        run: |
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          grep -v '^{' bench-windows.txt >> "$GITHUB_STEP_SUMMARY" || true
          tail -1 bench-windows.txt >> "$GITHUB_STEP_SUMMARY" || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: parakeet-onnx-windows
          path: bench-windows.txt
