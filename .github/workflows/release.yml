name: Release

on:
  workflow_dispatch:
    inputs:
      channel:
        description: 'Update channel'
        required: true
        default: stable
        type: choice
        options:
          - stable
          - beta
      release_type:
        description: 'Release type'
        required: true
        type: choice
        options:
          - current
          - patch
          - minor
          - major
      beta_number:
        description: 'Beta sequence number (required for beta, e.g. 1)'
        required: false
        type: string
      dry_run:
        description: 'Dry run (build signed and notarized artifacts only; no version commit, no tag, no GitHub release)'
        required: false
        default: false
        type: boolean

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  POSTHOG_PROJECT_TOKEN: ${{ vars.POSTHOG_PROJECT_TOKEN }}

concurrency:
  group: voicetypr-release
  cancel-in-progress: false

jobs:
  # ===========================================
  # Prepare: calculate version and validate
  # ===========================================
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      base_sha: ${{ steps.base.outputs.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Calculate version
        id: version
        env:
          INPUT_CHANNEL: ${{ inputs.channel }}
          INPUT_RELEASE_TYPE: ${{ inputs.release_type }}
          INPUT_BETA_NUMBER: ${{ inputs.beta_number }}
        run: node .github/scripts/release-tool.mjs calculate "$INPUT_CHANNEL" "$INPUT_RELEASE_TYPE" "$INPUT_BETA_NUMBER"

      - name: Capture base commit
        id: base
        run: |
          echo "sha=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: Check tag doesn't already exist
        if: ${{ !inputs.dry_run }}
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: node .github/scripts/release-tool.mjs check-tag "$RELEASE_TAG"

  # ===========================================
  # Build macOS (aarch64 - Apple Silicon)
  # ===========================================
  build-macos-aarch64:
    needs: prepare
    runs-on: macos-14
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.base_sha }}

      - name: Select Swift 6 toolchain and configure Clang runtime
        run: |
          xcode=$(find /Applications -maxdepth 1 \( -type d -o -type l \) \( -name 'Xcode_1[6-9]*.app' -o -name 'Xcode_[2-9][0-9]*.app' \) | sort -V | tail -1)
          if [ -z "$xcode" ]; then echo "No Xcode >=16 (Swift 6) found on runner" >&2; exit 1; fi
          echo "Selecting $xcode"
          sudo xcode-select -s "$xcode"
          swift --version
          # Xcode 16.4 emits availability checks in whisper.cpp's Metal objects,
          # but Rust's final link does not automatically include compiler-rt.
          # Older toolchains (e.g. GitHub-hosted Xcode 16.2) may not ship or
          # require the archive, so discovery is bundle-local and optional:
          # link libclang_rt.osx.a only when the selected Xcode actually has one.
          clang_runtime=$(
            find "$xcode/Contents/Developer/Toolchains/XcodeDefault.xctoolchain/usr/lib/clang" \
              -type f -name 'libclang_rt.osx.a' 2>/dev/null \
              | sort -V \
              | tail -1
          )
          if [ -n "$clang_runtime" ]; then
            echo "Linking compiler-rt archive: $clang_runtime"
            echo "RUSTFLAGS=${RUSTFLAGS:+$RUSTFLAGS }-C link-arg=$clang_runtime" >> "$GITHUB_ENV"
          else
            echo "No libclang_rt.osx.a in $xcode; continuing without explicit compiler-rt."
          fi

      - name: Capture Swift toolchain cache key
        id: swift-toolchain
        run: echo "hash=$(swift --version | shasum -a 256 | cut -d ' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Cache Swift Parakeet build
        uses: actions/cache@v5
        with:
          path: sidecar/parakeet-swift/.build
          key: parakeet-swift-${{ runner.os }}-${{ runner.arch }}-${{ steps.swift-toolchain.outputs.hash }}-${{ hashFiles('sidecar/parakeet-swift/Package.swift', 'sidecar/parakeet-swift/Package.resolved', 'sidecar/parakeet-swift/build.sh', 'sidecar/parakeet-swift/Sources/**') }}
          restore-keys: |
            parakeet-swift-${{ runner.os }}-${{ runner.arch }}-${{ steps.swift-toolchain.outputs.hash }}-

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.19.0'

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 10.13.1

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@1.91.1
        with:
          targets: aarch64-apple-darwin

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply release version
        run: node .github/scripts/release-tool.mjs apply-version "${{ needs.prepare.outputs.version }}"

      - name: Import Apple Certificate
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          echo "$APPLE_CERTIFICATE" | base64 --decode > certificate.p12
          security create-keychain -p actions build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p actions build.keychain
          security set-keychain-settings build.keychain
          security import certificate.p12 -k build.keychain -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k actions build.keychain
          rm certificate.p12

      - name: Build Parakeet sidecar (Apple Silicon only)
        run: |
          cd sidecar/parakeet-swift
          swift build -c release --arch arm64
          mkdir -p dist
          cp .build/arm64-apple-macosx/release/ParakeetSidecar dist/parakeet-sidecar-aarch64-apple-darwin
          chmod +x dist/parakeet-sidecar-aarch64-apple-darwin
          ln -sfn parakeet-sidecar-aarch64-apple-darwin dist/parakeet-sidecar

      - name: Build Tauri app
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}
        run: |
          TAURI_CONFIG_OVERRIDE=$(jq -nc --arg identity "$APPLE_SIGNING_IDENTITY" '{bundle:{macOS:{signingIdentity:$identity}}}')
          pnpm tauri build --target aarch64-apple-darwin --bundles app,dmg --config src-tauri/tauri.macos.conf.json --config "$TAURI_CONFIG_OVERRIDE" --ci --verbose

      - name: Create app.tar.gz for updater
        run: |
          cd src-tauri/target/aarch64-apple-darwin/release/bundle/macos
          APP_NAME=$(ls -d *.app | head -1)
          COPYFILE_DISABLE=1 tar -czf app.tar.gz --exclude='._*' --exclude='.DS_Store' "$APP_NAME"

      - name: Sign update artifact
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}
        run: |
          printf '%s' "$TAURI_SIGNING_PRIVATE_KEY" > /tmp/tauri.key
          pnpm tauri signer sign -f /tmp/tauri.key -p "${TAURI_SIGNING_PRIVATE_KEY_PASSWORD-}" \
            src-tauri/target/aarch64-apple-darwin/release/bundle/macos/app.tar.gz
          rm /tmp/tauri.key

      - name: Stage artifacts for upload
        run: |
          VERSION=$(node -p "require('./package.json').version")
          mkdir -p artifacts
          cp src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg artifacts/
          cp src-tauri/target/aarch64-apple-darwin/release/bundle/macos/app.tar.gz "artifacts/Voicetypr_${VERSION}_aarch64.app.tar.gz"
          cp src-tauri/target/aarch64-apple-darwin/release/bundle/macos/app.tar.gz.sig "artifacts/Voicetypr_${VERSION}_aarch64.app.tar.gz.sig"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-aarch64
          path: artifacts/
          retention-days: 5

      - name: Cache patched GlitchTip CLI
        id: glitchtip-cli-cache
        uses: actions/cache@v5
        with:
          path: ~/.cargo/bin/glitchtip-cli*
          key: glitchtip-cli-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.github/scripts/install-glitchtip-cli.mjs') }}

      - name: Upload debug symbols to GlitchTip
        env:
          GLITCHTIP_AUTH_TOKEN: ${{ secrets.GLITCHTIP_AUTH_TOKEN }}
          GLITCHTIP_CLI_CACHE_HIT: ${{ steps.glitchtip-cli-cache.outputs.cache-hit }}
        run: |
          if [ -z "$GLITCHTIP_AUTH_TOKEN" ]; then
            echo "::notice::GLITCHTIP_AUTH_TOKEN not configured; skipping debug symbol upload."
            exit 0
          fi

          EXECUTABLE="src-tauri/target/aarch64-apple-darwin/release/voicetypr"
          DSYM="${EXECUTABLE}.dSYM"

          if [ ! -f "$EXECUTABLE" ]; then
            echo "::error::Expected executable not found: $EXECUTABLE"
            exit 1
          fi

          # Generate dSYM from the built executable (idempotent if the build already produced one)
          /usr/bin/dsymutil "$EXECUTABLE"

          if [ ! -d "$DSYM" ]; then
            echo "::error::Failed to generate dSYM: $DSYM"
            exit 1
          fi

          DEBUG_FILE="$DSYM/Contents/Resources/DWARF/voicetypr"
          if [ ! -f "$DEBUG_FILE" ]; then
            echo "::error::Expected dSYM payload not found: $DEBUG_FILE"
            exit 1
          fi

          if [ "$GLITCHTIP_CLI_CACHE_HIT" = "true" ]; then
            glitchtip-cli --version
          else
            node .github/scripts/install-glitchtip-cli.mjs
          fi

          export SENTRY_URL="https://glitchtip.ideaplexa.com"
          export SENTRY_AUTH_TOKEN="$GLITCHTIP_AUTH_TOKEN"
          export SENTRY_ORG="ideaplexa"
          export SENTRY_PROJECT="voicetypr-desktop"

          echo "Checking and uploading debug symbols for aarch64 from: $DSYM"
          glitchtip-cli debug-files check "$DEBUG_FILE"
          glitchtip-cli debug-files upload --wait "$DSYM"

  # ===========================================
  # Build macOS (x86_64 - Intel)
  # ===========================================
  build-macos-x86_64:
