  # ===========================================
  # Build Windows x86_64 (CPU-safe app + optional Vulkan sidecar)
  # ===========================================
  build-windows:
    needs: prepare
    runs-on: windows-2022
    timeout-minutes: 180
    env:
      # Short paths keep whisper.cpp/ggml and Tauri builds below Windows path limits.
      CARGO_TARGET_DIR: D:\b\app
      ORT_CACHE_DIR: D:\b\ort-cache
      VULKAN_RUNTIME_VERSION: 1.3.290.0
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.base_sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.19.0'

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 10.13.1

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@1.91.1
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: windows-x64-build
          key: vulkan-${{ env.VULKAN_RUNTIME_VERSION }}
          workspaces: |
            src-tauri -> ../../../../b/app
            sidecar/whisper-vulkan -> ../../../../../b/vulkan

      - name: Cache ONNX Runtime archive
        uses: actions/cache@v5
        with:
          path: D:\b\ort-cache
          key: ort-windows-x64-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: ort-windows-x64-

      - name: Install Vulkan SDK
        uses: jakoch/install-vulkan-sdk-action@v1
        with:
          vulkan_version: 1.3.290.0
          install_runtime: true
          cache: true

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply release version
        run: node .github/scripts/release-tool.mjs apply-version "${{ needs.prepare.outputs.version }}"

      - name: Build whisper-vulkan sidecar (x86_64 only)
        shell: pwsh
        env:
          CARGO_TARGET_DIR: D:\b\vulkan
          RUSTFLAGS: -C target-feature=+crt-static
        run: |
          cargo build --manifest-path sidecar/whisper-vulkan/Cargo.toml --release
          if ($LASTEXITCODE -ne 0) {
            throw "Whisper Vulkan sidecar build failed with exit code $LASTEXITCODE"
          }
          New-Item -ItemType Directory -Force -Path "sidecar/whisper-vulkan/dist" | Out-Null
          $targetDir = $env:CARGO_TARGET_DIR
          if ([string]::IsNullOrWhiteSpace($targetDir)) {
            $targetDir = "sidecar/whisper-vulkan/target"
          }
          $sidecarExe = Join-Path $targetDir "release/whisper-vulkan-sidecar.exe"
          if (-not (Test-Path $sidecarExe)) {
            throw "Whisper Vulkan sidecar binary not found: $sidecarExe"
          }
          Copy-Item $sidecarExe "sidecar/whisper-vulkan/dist/whisper-vulkan-sidecar-x86_64-pc-windows-msvc.exe"

      - name: Download Windows runtime installers
        shell: pwsh
        run: |
          function Require-TrustedInstallerSignature($Path, $Name, [string[]]$AllowedPublisherFragments) {
            if (-not (Test-Path $Path)) {
              throw "$Name installer not found: $Path"
            }
            $signature = Get-AuthenticodeSignature -FilePath $Path
            if ($signature.Status -ne "Valid" -or -not $signature.SignerCertificate) {
              throw "$Name installer is not Authenticode signed by a trusted publisher (status: $($signature.Status))."
            }
            $subject = $signature.SignerCertificate.Subject
            foreach ($publisher in $AllowedPublisherFragments) {
              if ($subject -like "*$publisher*") {
                Write-Host "$Name installer signature verified: $subject"
                return
              }
            }
            throw "$Name installer signer is not an allowed publisher: $subject"
          }

          New-Item -ItemType Directory -Force -Path "src-tauri/windows/resources" | Out-Null
          Invoke-WebRequest -Uri "https://aka.ms/vs/17/release/vc_redist.x64.exe" -OutFile "src-tauri/windows/resources/vc_redist.x64.exe"
          $vulkanVersion = $env:VULKAN_RUNTIME_VERSION
          if ([string]::IsNullOrWhiteSpace($vulkanVersion)) {
            $vulkanVersion = $env:VULKAN_VERSION
          }
          if ([string]::IsNullOrWhiteSpace($vulkanVersion)) {
            $vulkanVersion = Split-Path -Leaf $env:VULKAN_SDK
          }
          if ([string]::IsNullOrWhiteSpace($vulkanVersion)) {
            throw "Cannot determine Vulkan version. Set VULKAN_RUNTIME_VERSION, VULKAN_VERSION, or VULKAN_SDK."
          }
          $vulkanRuntimeUrl = "https://sdk.lunarg.com/sdk/download/$vulkanVersion/windows/VulkanRT-$vulkanVersion-Installer.exe"
          Invoke-WebRequest -Uri $vulkanRuntimeUrl -OutFile "src-tauri/windows/resources/VulkanRT-Installer.exe"
          Require-TrustedInstallerSignature "src-tauri/windows/resources/vc_redist.x64.exe" "Visual C++ Runtime" @("Microsoft Corporation")
          Require-TrustedInstallerSignature "src-tauri/windows/resources/VulkanRT-Installer.exe" "Vulkan Runtime" @("LunarG", "The Khronos Group")

      - name: Build Tauri app (x86_64 CPU-safe main app)
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}
          # /PDBALTPATH:%_PDB% records a RELATIVE pdb name in the PE so dbghelp
          # resolves voicetypr.pdb next to the installed exe (not the CI build path).
          RUSTFLAGS: "-C target-feature=+crt-static -C link-arg=/PDBALTPATH:%_PDB%"
          VOICETYPR_REQUIRE_VULKAN_SIDECAR: "1"
        run: pnpm tauri build --target x86_64-pc-windows-msvc --ci --config src-tauri/tauri.windows.conf.json

      - name: Assert CPU build does not import vulkan-1.dll
        shell: pwsh
        run: |
          & ./src-tauri/windows/assert-no-vulkan-import.ps1 -ExePath "$env:CARGO_TARGET_DIR\x86_64-pc-windows-msvc\release\voicetypr.exe"

      - name: Assert ONNX Runtime is not a DLL import
        shell: pwsh
        run: |
          & ./src-tauri/windows/assert-no-onnxruntime-import.ps1 -ExePath "$env:CARGO_TARGET_DIR\x86_64-pc-windows-msvc\release\voicetypr.exe"

      - name: Sign installer for updates
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}
        shell: pwsh
        run: |
          $installer = Get-ChildItem "$env:CARGO_TARGET_DIR\x86_64-pc-windows-msvc\release\bundle\nsis\*.exe" | Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if (-not $installer) {
            throw "No NSIS installer found at $env:CARGO_TARGET_DIR\x86_64-pc-windows-msvc\release\bundle\nsis\*.exe"
          }

          $keyPath = "$env:TEMP\tauri.key"
          [IO.File]::WriteAllText($keyPath, $env:TAURI_SIGNING_PRIVATE_KEY)

          try {
            $password = "$env:TAURI_SIGNING_PRIVATE_KEY_PASSWORD"
            $signArgs = @("tauri", "signer", "sign", "--private-key-path", $keyPath)

            if ([string]::IsNullOrWhiteSpace($password)) {
              Write-Host "Signing with explicit empty password."
              $signArgs += "--password="
            } else {
              $signArgs += "--password=$password"
            }

            $signArgs += "$($installer.FullName)"
            & pnpm @signArgs

            if ($LASTEXITCODE -ne 0) {
              throw "tauri signer failed with exit code $LASTEXITCODE"
            }

            if (-not (Test-Path "$($installer.FullName).sig")) {
              throw "tauri signer did not create $($installer.FullName).sig"
            }
          } finally {
            Remove-Item "$keyPath" -ErrorAction SilentlyContinue
          }

      - name: Stage artifacts for upload
        shell: pwsh
        run: |
          $version = "${{ needs.prepare.outputs.version }}"
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null
          $installer = Get-ChildItem "$env:CARGO_TARGET_DIR\x86_64-pc-windows-msvc\release\bundle\nsis\*.exe" | Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if (-not $installer) { throw "No NSIS installer found" }
          Copy-Item $installer.FullName "artifacts/Voicetypr_${version}_x64-setup.exe"
          $sig = "$($installer.FullName).sig"
          if (-not (Test-Path $sig)) {
            throw "Missing installer signature: $sig"
          }
          Copy-Item $sig "artifacts/Voicetypr_${version}_x64-setup.exe.sig"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: artifacts/
          retention-days: 5

      - name: Cache patched GlitchTip CLI
        id: glitchtip-cli-cache
        uses: actions/cache@v5
        with:
          path: ~/.cargo/bin/glitchtip-cli*
          key: glitchtip-cli-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.github/scripts/install-glitchtip-cli.mjs') }}

      - name: Upload debug symbols to GlitchTip
        env:
          GLITCHTIP_AUTH_TOKEN: ${{ secrets.GLITCHTIP_AUTH_TOKEN }}
          GLITCHTIP_CLI_CACHE_HIT: ${{ steps.glitchtip-cli-cache.outputs.cache-hit }}
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace($env:GLITCHTIP_AUTH_TOKEN)) {
            Write-Host "::notice::GLITCHTIP_AUTH_TOKEN not configured; skipping debug symbol upload."
            exit 0
          }

          $PDB = Join-Path $env:CARGO_TARGET_DIR "x86_64-pc-windows-msvc\release\voicetypr.pdb"
          if (-not (Test-Path $PDB)) {
            Write-Host "::error::Expected PDB not found: $PDB - native symbols were not generated."
            exit 1
          }

          if ($env:GLITCHTIP_CLI_CACHE_HIT -eq "true") {
            glitchtip-cli --version
            if ($LASTEXITCODE -ne 0) { throw "Cached GlitchTip CLI failed with exit code $LASTEXITCODE" }
          } else {
            node .github/scripts/install-glitchtip-cli.mjs
            if ($LASTEXITCODE -ne 0) { throw "GlitchTip CLI install failed with exit code $LASTEXITCODE" }
          }

          $env:SENTRY_URL = "https://glitchtip.ideaplexa.com"
          $env:SENTRY_AUTH_TOKEN = $env:GLITCHTIP_AUTH_TOKEN
          $env:SENTRY_ORG = "ideaplexa"
          $env:SENTRY_PROJECT = "voicetypr-desktop"

          Write-Host "Checking and uploading debug symbols for x86_64 from: $PDB"
          glitchtip-cli debug-files check $PDB
          if ($LASTEXITCODE -ne 0) { throw "glitchtip-cli debug-files check failed with exit code $LASTEXITCODE" }
          glitchtip-cli debug-files upload --wait $PDB
          if ($LASTEXITCODE -ne 0) { throw "glitchtip-cli debug-files upload failed with exit code $LASTEXITCODE" }

  # ===========================================
  # Publish: bump version, commit, tag, push
  # ===========================================
  publish:
    needs: [prepare, build-macos-aarch64, build-macos-x86_64, build-windows]
    runs-on: ubuntu-latest
    if: ${{ !inputs.dry_run }}
    permissions:
      contents: write
    outputs:
      ref: ${{ steps.push.outputs.ref }}
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Ensure main did not move during build
        run: |
          BASE_SHA="${{ needs.prepare.outputs.base_sha }}"
          CURRENT_SHA="$(git rev-parse HEAD)"
          if [[ "$CURRENT_SHA" != "$BASE_SHA" ]]; then
            echo "::error::main moved from $BASE_SHA to $CURRENT_SHA while builds were running. Re-run release from latest main."
            exit 1
          fi

      - name: Ensure tag doesn't already exist
        env:
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        run: node .github/scripts/release-tool.mjs check-tag "$RELEASE_TAG"

      - name: Bump version files
        run: |
          export RELEASE_VERSION="${{ needs.prepare.outputs.version }}"
          node .github/scripts/release-tool.mjs apply-version "$RELEASE_VERSION"
          cargo update \
            --manifest-path src-tauri/Cargo.toml \
            -p voicetypr \
            --precise "$RELEASE_VERSION"
          cargo metadata \
            --manifest-path src-tauri/Cargo.toml \
            --locked \
            --format-version 1 \
            --no-deps >/dev/null

      - name: Commit, tag, and push
        id: push
        env:
          RELEASE_CHANNEL: ${{ inputs.channel }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json src-tauri/Cargo.toml src-tauri/Cargo.lock CHANGELOG.md
          git diff --cached --stat
          if git diff --cached --quiet; then
            echo "No version file changes; tagging current commit"
          else
            git commit -m "chore: release ${{ needs.prepare.outputs.tag }}"
          fi
          git tag -a "${{ needs.prepare.outputs.tag }}" -m "Release ${{ needs.prepare.outputs.tag }}"

          if [[ "$RELEASE_CHANNEL" == "beta" ]]; then
            # Keep prerelease versions out of main. The tag makes the release commit
            # immutable/reachable; Stable promotion later performs the normal main bump.
            git push origin "${{ needs.prepare.outputs.tag }}"
          else
            git push --atomic origin main "${{ needs.prepare.outputs.tag }}"
          fi
          echo "ref=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  # ===========================================
  # Create Release (after publish succeeds)
  # ===========================================
  release:
    needs: [prepare, build-macos-aarch64, build-macos-x86_64, build-windows, publish]
    runs-on: ubuntu-latest
    if: ${{ !inputs.dry_run }}
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.publish.outputs.ref }}

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare release files
        run: |
          mkdir -p release
          VERSION="${{ needs.prepare.outputs.version }}"

          # macOS aarch64
          cp artifacts/macos-aarch64/*.dmg "release/Voicetypr_${VERSION}_aarch64.dmg"
          cp artifacts/macos-aarch64/Voicetypr_${VERSION}_aarch64.app.tar.gz "release/Voicetypr_${VERSION}_aarch64.app.tar.gz"
          cp artifacts/macos-aarch64/Voicetypr_${VERSION}_aarch64.app.tar.gz.sig "release/Voicetypr_${VERSION}_aarch64.app.tar.gz.sig"

          # macOS x86_64
          cp artifacts/macos-x86_64/*.dmg "release/Voicetypr_${VERSION}_x86_64.dmg"
          cp artifacts/macos-x86_64/Voicetypr_${VERSION}_x86_64.app.tar.gz "release/Voicetypr_${VERSION}_x86_64.app.tar.gz"
          cp artifacts/macos-x86_64/Voicetypr_${VERSION}_x86_64.app.tar.gz.sig "release/Voicetypr_${VERSION}_x86_64.app.tar.gz.sig"

          # Windows x64 (CPU-safe main app with bundled optional Vulkan sidecar)
          cp artifacts/windows-x64/Voicetypr_${VERSION}_x64-setup.exe "release/Voicetypr_${VERSION}_x64-setup.exe"
          cp artifacts/windows-x64/Voicetypr_${VERSION}_x64-setup.exe.sig "release/Voicetypr_${VERSION}_x64-setup.exe.sig"

      - name: Generate latest.json
        run: |
          VERSION="${{ needs.prepare.outputs.version }}"
          TAG="${{ needs.prepare.outputs.tag }}"

          AARCH64_SIG=$(tr -d '\n' < "release/Voicetypr_${VERSION}_aarch64.app.tar.gz.sig")
          X86_64_SIG=$(tr -d '\n' < "release/Voicetypr_${VERSION}_x86_64.app.tar.gz.sig")
          WINDOWS_SIG=$(tr -d '\n' < "release/Voicetypr_${VERSION}_x64-setup.exe.sig")

          if [ -z "$AARCH64_SIG" ] || [ -z "$X86_64_SIG" ] || [ -z "$WINDOWS_SIG" ]; then
            echo "::error::One or more signature files are missing or empty"
            exit 1
          fi

          jq -n \
            --arg version "$TAG" \
            --arg notes "See the release notes for $TAG" \
            --arg pub_date "$(date -u +"%Y-%m-%dT%H:%M:%SZ")" \
            --arg aarch64_sig "$AARCH64_SIG" \
            --arg aarch64_url "https://github.com/${{ github.repository }}/releases/download/$TAG/Voicetypr_${VERSION}_aarch64.app.tar.gz" \
            --arg x86_64_sig "$X86_64_SIG" \
            --arg x86_64_url "https://github.com/${{ github.repository }}/releases/download/$TAG/Voicetypr_${VERSION}_x86_64.app.tar.gz" \
            --arg windows_sig "$WINDOWS_SIG" \
            --arg windows_url "https://github.com/${{ github.repository }}/releases/download/$TAG/Voicetypr_${VERSION}_x64-setup.exe" \
            '{
              version: $version,
              notes: $notes,
              pub_date: $pub_date,
              platforms: {
                "darwin-aarch64": { signature: $aarch64_sig, url: $aarch64_url },
                "darwin-x86_64": { signature: $x86_64_sig, url: $x86_64_url },
                "windows-x86_64": { signature: $windows_sig, url: $windows_url }
              }
            }' > release/latest.json

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          name: Voicetypr ${{ needs.prepare.outputs.tag }}
          draft: true
          prerelease: ${{ inputs.channel == 'beta' }}
          generate_release_notes: true
          files: release/*
