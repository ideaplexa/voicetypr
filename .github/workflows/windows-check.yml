name: Windows Checks (fast)

# Code-only Windows verification: clippy (-D warnings), the full Rust test suite,
# and a main-executable Ivy Bridge CLI smoke check, WITHOUT the slow/flaky release bits
# (Vulkan SDK install, Whisper-Vulkan sidecar compile, VC++ runtime staging, Tauri
# bundle). Those are only needed to produce the installer, not to prove the code is
# correct on Windows. Mirrors the known-good macOS `build-macos` check steps.
#
# Run it on-demand from the Actions tab ("Run workflow") for high-confidence Windows
# feedback without the full installer build. ORT is loaded lazily from the official
# Microsoft CPU DLL staged by the packaging script. Runs automatically on PRs.

on:
  workflow_dispatch: {}
  pull_request:
    branches: [main]

concurrency:
  group: windows-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-check:
    runs-on: windows-2022
    env:
      # Keep Windows paths short to avoid MSBuild/FileTracker failures on deep deps.
      CARGO_TARGET_DIR: D:\cargo-target
    steps:
      - uses: actions/checkout@v5

      - name: Set GGML CPU baseline
        uses: ./.github/actions/ggml-cpu-baseline

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22.19.0'
          package-manager-cache: false

      - name: Setup pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.13.1 --activate
          pnpm --version

      - name: Rust cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6  # v2.9.2
        with:
          # whisper-rs-sys does not track GGML_* as Cargo rerun triggers.
          env-vars: GGML
          workspaces: src-tauri

      - name: Assert Parakeet ONNX dependency is absent on Windows ARM64
        shell: pwsh
        run: |
          $tree = cargo tree --manifest-path src-tauri/Cargo.toml --target aarch64-pc-windows-msvc -p voicetypr --edges normal --prefix none
          if ($LASTEXITCODE -ne 0) { throw "cargo tree failed with exit code $LASTEXITCODE" }
          if (@($tree | Where-Object { $_ -match '^parakeet-rs v' }).Count -gt 0) {
            throw 'parakeet-rs must not be a Windows ARM64 dependency'
          }

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # tauri's Windows build.rs validates that every externalBin + resource path in
      # tauri.windows.conf.json EXISTS — even for clippy/cargo test. We check code, not
      # build an installer, so drop in empty placeholders instead of the slow/flaky
      # Vulkan SDK + sidecar compile + VC++ runtime staging.
      - name: Stub Windows bundle resources (existence-only)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path sidecar/whisper-vulkan/dist | Out-Null
          New-Item -ItemType File -Force -Path sidecar/whisper-vulkan/dist/whisper-vulkan-sidecar-x86_64-pc-windows-msvc.exe | Out-Null
          New-Item -ItemType Directory -Force -Path src-tauri/windows/resources | Out-Null
          New-Item -ItemType Directory -Force -Path src-tauri/windows/resources/vcredist | Out-Null
          foreach ($f in @('vcredist/placeholder.dll','voicetypr.pdb')) {
            New-Item -ItemType File -Force -Path "src-tauri/windows/resources/$f" | Out-Null
          }

      - name: Build frontend
        run: pnpm build

      - name: Clippy (-D warnings, all targets)
        run: cd src-tauri && cargo clippy --workspace --all-targets -- -D warnings

      - name: ORT NSIS and MSIX dependency/notice staging regressions
        run: node --test scripts/stage-windows-ort.test.cjs

      # Match the repo's Windows test contract: run-tests.ps1 builds tests
      # (--no-run) then runs the exes with a Common-Controls manifest, working
      # around the TaskDialogIndirect entry-point error (tauri-apps/tauri#13419).
      # Plain `cargo test` fails on Windows, so it must NOT be used here.
      - name: Rust tests
        shell: pwsh
        working-directory: src-tauri
        run: ./run-tests.ps1

      - name: Build main executable for Ivy Bridge check
        shell: pwsh
        run: |
          # Keep map output out of clippy/tests and preserve any existing flags.
          $targetRoot = [IO.Path]::GetFullPath($env:CARGO_TARGET_DIR).Replace('\', '/')
          $env:RUSTFLAGS = "$env:RUSTFLAGS -C target-feature=+crt-static -C link-arg=/PDBALTPATH:%_PDB%".Trim()
          $env:VOICETYPR_MAIN_MAP = "$targetRoot/voicetypr.map"
          cargo build --manifest-path src-tauri/Cargo.toml --release --bin voicetypr
          if ($LASTEXITCODE -ne 0) { throw "Main executable build failed: $LASTEXITCODE" }

      - name: Assert ONNX Runtime is lazy-loaded, not imported or statically linked
        shell: pwsh
        run: |
          & ./src-tauri/windows/assert-no-onnxruntime-import.ps1 -ExePath "$env:CARGO_TARGET_DIR/release/voicetypr.exe" -MapPath "$env:CARGO_TARGET_DIR/voicetypr.map"

      # No desktop or ASR model: Ivy Bridge must reach the lazy-runtime CPU guard.
      - name: Check CLI on Ivy Bridge (no AVX2, Intel SDE)
        uses: ./.github/actions/ivy-bridge-smoke
        timeout-minutes: 15
        with:
          executable-path: ${{ env.CARGO_TARGET_DIR }}/release/voicetypr.exe
