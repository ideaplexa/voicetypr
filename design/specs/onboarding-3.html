<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      tailwind = { config: { corePlugins: { preflight: false } } };
    </script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Geist%3Awght%40100..900&family=Inter%3Awght%40100..900&display=swap"
      rel="stylesheet"
    />
    <style>
      *, ::before, ::after {
        box-sizing: border-box;
      }

      body {
        margin: 0;
      }
    </style>
  </head>
  <body style="background-color: #F7F7F5">
    <div
      data-pencil-name="Onboarding — 3 First dictation"
      class="box-border w-[1000px] h-[680px] flex flex-col gap-0 p-[44px_0px_0px_0px] justify-start items-center bg-[#F7F7F5] [outline:1px_solid_#E4E4E0] [outline-offset:-0.5px] rounded-[12px] overflow-hidden"
    >
      <div
        data-pencil-name="Progress"
        class="box-border w-fit h-fit shrink-0 flex flex-row gap-[6px] justify-start items-center"
      >
        <div
          data-pencil-name="Step 1"
          class="box-border w-[8px] shrink-0 h-[6px] bg-[#3F7D5C] rounded-[3px]"
        ></div>
        <div
          data-pencil-name="Step 2"
          class="box-border w-[8px] shrink-0 h-[6px] bg-[#3F7D5C] rounded-[3px]"
        ></div>
        <div
          data-pencil-name="Step 3"
          class="box-border w-[28px] shrink-0 h-[6px] bg-[#3F7D5C] rounded-[3px]"
        ></div>
      </div>
      <div
        data-pencil-name="Content"
        class="box-border w-[620px] [flex:1_1_0] flex flex-col gap-[22px] justify-center items-center"
      >
        <div
          data-pencil-name="Title"
          class="text-[26px]/[normal] box-border text-[#18181A] font-[Geist,system-ui,sans-serif] font-semibold tracking-[-0.5px] text-left [white-space:nowrap]"
        >
          Try it now
        </div>
        <div
          data-pencil-name="Instruction"
          class="box-border w-fit h-fit shrink-0 flex flex-row gap-[10px] justify-start items-center"
        >
          <div
            data-pencil-name="Hold"
            class="text-[16px]/[normal] box-border text-[#6A6A66] font-[Geist,system-ui,sans-serif] font-normal text-left [white-space:nowrap]"
          >
            Hold
          </div>
          <div
            data-pencil-name="Key ⌥"
            class="box-border w-fit shrink-0 h-fit flex flex-row gap-0 p-[5px_10px] justify-start items-start bg-[#FFFFFF] [outline:1px_solid_#E4E4E0] [outline-offset:-0.5px] rounded-[7px]"
          >
            <div
              data-pencil-name="K"
              class="text-[15px]/[normal] box-border text-[#18181A] font-[Inter,system-ui,sans-serif] font-semibold text-left [white-space:nowrap]"
            >
              ⌥
            </div>
          </div>
          <div
            data-pencil-name="Key Space"
            class="box-border w-fit shrink-0 h-fit flex flex-row gap-0 p-[5px_10px] justify-start items-start bg-[#FFFFFF] [outline:1px_solid_#E4E4E0] [outline-offset:-0.5px] rounded-[7px]"
          >
            <div
              data-pencil-name="K"
              class="text-[15px]/[normal] box-border text-[#18181A] font-[Inter,system-ui,sans-serif] font-semibold text-left [white-space:nowrap]"
            >
              Space
            </div>
          </div>
          <div
            data-pencil-name="Say"
            class="text-[16px]/[normal] box-border text-[#6A6A66] font-[Geist,system-ui,sans-serif] font-normal text-left [white-space:nowrap]"
          >
            and say anything, then let go.
          </div>
        </div>
        <div
          data-pencil-name="Try box"
          class="box-border w-full h-[150px] shrink-0 flex flex-col gap-[10px] p-[18px] justify-start items-start bg-[#FFFFFF] [outline:1.5px_solid_#3F7D5C] [outline-offset:-0.75px] rounded-[14px]"
        >
          <div
            data-pencil-name="Text"
            class="text-[17px]/[26px] box-border w-full text-[#18181A] font-[Geist,system-ui,sans-serif] font-normal text-left"
          >
            Hello, this is my first dictation with Voicetypr.
          </div>

            class="box-border w-fit h-fit shrink-0 flex flex-row gap-[8px] justify-start items-center"

            </svg>
            <div
              data-pencil-name="Label"
              class="text-[12.5px]/[normal] box-border text-[#3F7D5C] font-[Geist,system-ui,sans-serif] font-medium text-left [white-space:nowrap]"
            >
              Worked · 0.4 s from release to text
            </div>
          </div>
        </div>
        <div
          data-pencil-name="Pill"
          class="box-border w-fit h-fit shrink-0 [box-shadow:0px_8px_24px_#00000030] flex flex-row gap-[10px] p-[7px_12px] justify-start items-center bg-[#121316] [outline:1px_solid_#FFFFFF1F] [outline-offset:-0.5px] rounded-[18px]"
        >
          <svg
            data-pencil-name="Check"
            data-icon-name="check"
            data-icon-set="lucide"
            viewBox="0 0 13.99993896484375 14"
            preserveAspectRatio="xMidYMid meet"
            xmlns="http://www.w3.org/2000/svg"
            class="box-border w-[14px] shrink-0 h-[14px]"
          >

          <div
            data-pencil-name="Label"
            class="text-[12px]/[normal] box-border text-[#FFFFFFE6] font-[Inter,system-ui,sans-serif] font-normal text-left [white-space:nowrap]"
          >
            Pasted · 9 words
          </div>
        </div>
        <div
          data-pencil-name="Buttons"
          class="box-border w-fit h-fit shrink-0 flex flex-row gap-[10px] justify-start items-start"
        >
          <div
            data-pencil-name="Change"
            class="box-border w-fit shrink-0 h-fit flex flex-row gap-[8px] p-[9px_16px] justify-start items-center bg-[#FFFFFF] [outline:1px_solid_#E4E4E0] [outline-offset:-0.5px] rounded-[10px]"
          >
            <div
              data-pencil-name="Label"
              class="text-[13px]/[normal] box-border text-[#18181A] font-[Geist,system-ui,sans-serif] font-medium text-left [white-space:nowrap]"
            >
              Change shortcut
            </div>
          </div>
          <div
            data-pencil-name="Done"
            class="box-border w-fit shrink-0 h-fit flex flex-row gap-[8px] p-[9px_16px] justify-start items-center bg-[#18181A] rounded-[10px]"
          >
            <div
              data-pencil-name="Label"
              class="text-[13px]/[normal] box-border text-[#F7F7F5] font-[Geist,system-ui,sans-serif] font-medium text-left [white-space:nowrap]"
            >
              Start using Voicetypr
            </div>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
